# Griffith security rules.
#
# Each rule has:
#   id          unique rule identifier (kebab-case)
#   severity    one of: critical, high, medium, low, info
#   pattern     regex, applied line-by-line (uses the `regex` library with timeout)
#   context     glob or [glob, ...] for paths (relative to plugin root) where the rule applies
#   exclude     optional glob or [glob, ...] for paths to skip within context
#   message     human-readable description emitted with the finding
#   strict      optional bool (default false). If true, the rule runs ONLY in --strict mode.
#
# Context/exclude glob syntax:
#   *       any chars except /
#   **      any number of path segments (including zero)
#   ?       any single char except /
#
# Default rules target high-precision detection (low false-positive).
# Strict-only rules are broader but noisier; they run under `griffith analyze --strict`.

rules:
  # ---------------------------------------------------------------------------
  # CRITICAL — direct RCE or credential theft
  # ---------------------------------------------------------------------------

  - id: curl-pipe-shell
    severity: critical
    pattern: 'curl\s+[^|]*\|\s*(sh|bash|zsh)\b'
    context: "**/*.sh"
    message: "Pipe to shell (curl | sh) — remote code execution vector"

  - id: python-eval-exec
    severity: critical
    pattern: '\b(eval|exec)\s*\('
    context: "**/*.py"
    # Hook Python files are covered by the AST-based dynamic-code-exec
    # rules (info capability + medium dynamic-arg) which distinguish
    # safe `exec("literal")` from `exec(compile(...))` evasion. This
    # rule stays as a critical regex fallback for non-hook Python
    # (where we have no AST coverage) and continues to exclude test
    # files (the original scope).
    exclude: ["**/test_*.py", "**/*_test.py", "hooks/**/*.py"]
    message: "Dynamic code execution (eval/exec). For hook Python, see dynamic-code-exec (info capability) and dynamic-code-exec-dynamic-arg (medium) for AST-based detection that distinguishes safe literal-arg calls from evasion patterns."

  - id: hooks-path-tampering
    severity: critical
    pattern: 'core\.hooksPath'
    context: "**/*"
    exclude: "**/*.md"
    message: "Git core.hooksPath override — persistent backdoor vector"

  - id: claude-settings-write
    severity: critical
    pattern: '~/\.claude/(settings|hooks|keybindings)(\.local)?\.json'
    context: "**/*"
    exclude: "**/*.md"
    message: "Write to Claude Code config — possible persistent compromise"

  - id: ssh-key-reference
    severity: critical
    pattern: '~/\.ssh/(id_[a-z_]+|authorized_keys|known_hosts)'
    context: "**/*"
    exclude: "**/*.md"
    message: "SSH key reference — possible credential exfiltration"

  - id: aws-credentials-reference
    severity: critical
    pattern: '~/\.aws/credentials|AWS_SECRET_ACCESS_KEY\s*='
    context: "**/*"
    exclude: "**/*.md"
    message: "AWS credentials reference"

  # ---------------------------------------------------------------------------
  # HIGH — hook execution, persistence, obfuscation
  # ---------------------------------------------------------------------------

  - id: subprocess-in-hooks
    severity: info
    pattern: 'subprocess\.(call|run|Popen|check_output|check_call)'
    context: "hooks/**/*"
    message: "Capability signal: plugin uses subprocess from a hook. See subprocess-shell-true / subprocess-dynamic-command / subprocess-no-timeout for stricter context-aware findings on the same call site."

  - id: os-system-in-hooks
    severity: high
    pattern: '\bos\.system\s*\('
    context: "hooks/**/*"
    message: "os.system in hook — shell command execution"

  - id: bash-c-inline
    severity: info
    pattern: '\b(bash|sh|zsh)\s+-c\s+'
    context: ["hooks/**/*", "**/*.sh"]
    message: "Capability signal: plugin invokes a shell via -c. See bash-c-dynamic-interpolated (critical) and bash-c-dynamic-literal-dollar (medium) for stricter context-aware findings."

  # bash-c-dynamic-interpolated: the double-quoted arg must contain a
  # dynamic marker. Body is (?:[^"\\]|\\.)*? — handles escaped inner
  # quotes \" — followed by lookahead for $VAR / ${...} / $(...) / backtick.
  # Combined via alternation with the unquoted bare -c + $ case.
  - id: bash-c-dynamic-interpolated
    severity: critical
    pattern: '(?<![\w-])(?:bash|sh|zsh)\s+-c\s+(?:"(?:[^"\\]|\\.)*?(?:\$[A-Za-z_\{]|\$\(|`)|[^"''\s]*\$)'
    context: ["hooks/**/*", "**/*.sh"]
    message: "bash -c argument contains dynamic shell expansion (${VAR}, $(...), or backticks) — runtime-controlled inputs can enable command injection. Known limitations: multi-line -c args with backslash-continuation are not detected."

  # bash-c-dynamic-literal-dollar: single-quoted -c arg containing
  # literal $. Shell normally suppresses $-expansion inside single
  # quotes, but the presence of $ in this context is unusual and often
  # indicates deferred-shell intent (nested sh -c expansion). Medium
  # severity reflects uncertainty; capability info always fires too.
  - id: bash-c-dynamic-literal-dollar
    severity: medium
    pattern: "(?<![\\w-])(?:bash|sh|zsh)\\s+-c\\s+'[^']*\\$[A-Za-z_\\{][^']*'"
    context: ["hooks/**/*", "**/*.sh"]
    message: "bash -c single-quoted argument contains literal $ — shell suppresses expansion here, but the pattern often indicates deferred-shell intent. Verify the argument is not then re-evaluated by a nested shell."

  - id: dotfile-write
    severity: high
    pattern: '~/\.(zshrc|bashrc|bash_profile|profile|zprofile)'
    context: "**/*"
    exclude: "**/*.md"
    message: "Modifying shell startup file — possible persistence"

  - id: launch-agent-write
    severity: high
    pattern: '~/Library/Launch(Agents|Daemons)/|/Library/Launch(Agents|Daemons)/'
    context: "**/*"
    exclude: "**/*.md"
    message: "macOS LaunchAgent/Daemon modification — possible persistence"

  - id: osascript-exec
    severity: high
    pattern: '\bosascript\b'
    context: "**/*"
    exclude: "**/*.md"
    message: "AppleScript execution — broad macOS automation"

  - id: network-egress-shell
    severity: high
    pattern: '\b(wget|nc|ncat)\s+'
    context: "hooks/**/*"
    message: "Network egress primitive (wget/nc) in hook"

  # ---------------------------------------------------------------------------
  # MEDIUM — concerning but context-dependent
  # ---------------------------------------------------------------------------

  - id: chmod-777
    severity: medium
    pattern: 'chmod\s+[0-7]*777'
    context: "**/*.sh"
    message: "Overly permissive file permissions (777)"

  - id: path-traversal
    severity: info
    pattern: '\.\./\.\.'
    context: "**/*"
    exclude: "**/*.md"
    message: "Capability signal: '../..' substring detected. See path-traversal-dynamic-{python,js,shell} for stricter context-aware findings on this file type."

  # path-traversal-dynamic-js: '../' in a string context where
  # interpolation or runtime identifier concatenation is present.
  # Covers template literals `${...}` and string-concat `"../" + ident`.
  # Rejects pure-static template literals and pure-constant strings.
  - id: path-traversal-dynamic-js
    severity: high
    pattern: '\.\./(?:[^"''`]*?\$\{|[^"''`]*?\$[A-Za-z_])|"(?:[^"\\]|\\.)*?\.\./[^"]*"\s*\+\s*[A-Za-z_]|''[^'']*?\.\./[^'']*''\s*\+\s*[A-Za-z_]'
    context: ["**/*.js", "**/*.ts"]
    message: "JavaScript/TypeScript: '../' composed with a runtime value (template literal interpolation or string concat) — potential path traversal with attacker-influenced segment."

  # path-traversal-dynamic-shell: '../' adjacent to $VAR / ${...} / $(...).
  - id: path-traversal-dynamic-shell
    severity: high
    pattern: '\.\./(?:[^\s$]*)?(?:\$[A-Za-z_]|\$\{|\$\()'
    context: "**/*.sh"
    message: "Shell: '../' adjacent to a variable / command substitution — potential path traversal with attacker-influenced segment."

  - id: bidi-override-chars
    severity: medium
    pattern: '[\u202A-\u202E\u2066-\u2069]'
    context: "**/*.md"
    message: "Unicode bidirectional override — can visually hide malicious text"

  # ---------------------------------------------------------------------------
  # INFO — observability; not alarming on its own
  # ---------------------------------------------------------------------------

  - id: skill-uses-webfetch
    severity: info
    pattern: 'WebFetch\b'
    context: "skills/**/*.md"
    message: "Skill requests network access via WebFetch"

  - id: skill-uses-bash
    severity: info
    pattern: '\bBash\('
    context: "skills/**/*.md"
    message: "Skill invokes shell via Bash tool"

  - id: hook-requires-gh-cli
    severity: info
    pattern: '\bgh\s+'
    context: "hooks/**/*"
    message: "Hook uses GitHub CLI (gh)"

  # ---------------------------------------------------------------------------
  # STRICT-ONLY — broader detection with higher false-positive rate
  # ---------------------------------------------------------------------------

  - id: broad-credential-assignment
    severity: medium
    strict: true
    pattern: '\b(ANTHROPIC_API_KEY|OPENAI_API_KEY|AWS_ACCESS_KEY_ID|SECRET_KEY|PASSWORD)\s*='
    context: "**/*"
    exclude: ["**/*.md", "**/*.example", "**/test_*", "**/*_test.*"]
    message: "Credential-like assignment (strict mode)"

  - id: python-subprocess-anywhere
    severity: low
    strict: true
    pattern: 'subprocess\.(call|run|Popen)'
    context: "**/*.py"
    exclude: "hooks/**/*"
    message: "Python subprocess outside hooks (strict mode)"
