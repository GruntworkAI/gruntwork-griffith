[tool.poetry]
name = "griffith"
version = "0.1.0"
description = "Plugin Observatory for Claude Code - analyze, compare, and monitor plugins"
authors = ["Michael Fisher <michael@gruntwork.ai>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/GruntworkAI/gruntwork-griffith"
keywords = ["claude", "claude-code", "plugins", "analysis", "security"]

[tool.poetry.scripts]
griffith = "griffith.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1"
rich = "^13.0"
tiktoken = ">=0.8"
pyyaml = "^6.0"
requests = "^2.31"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
black = "^24.0"
ruff = "^0.1"
mypy = "^1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (e.g., real git clone). Skip with -m 'not network'",
    "adversarial: tests exercising defensive behavior against malicious inputs",
]
